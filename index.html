<body>
<title>Fusion Twin PhD</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..125,500..800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: a working tool. Sticky top bar with tabs; content column max 1120px; Today = main column + side rail. */
:root{
  --bg:#F3F4F8; --surface:#FFFFFF; --sunk:#E9EBF2; --ink:#14172B; --muted:#596079; --line:#D9DCE7;
  --violet:#4B2A9A; --ember:#C2410C; --gold:#D99A00; --ok:#1D7A4B; --warn:#B45309;
  --heat:linear-gradient(90deg,#3B1F8C 0%,#9B2C7A 38%,#D9480F 72%,#E8A300 100%);
  --display:"Archivo",ui-sans-serif,system-ui,sans-serif;
  --body:"IBM Plex Sans",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){color-scheme:dark;
    --bg:#0D0F1C; --surface:#161A2C; --sunk:#1E2338; --ink:#E7E9F5; --muted:#9BA1BC; --line:#2A3050;
    --violet:#A48BF0; --ember:#FB8A4A; --gold:#F2C14E; --ok:#4CC98A; --warn:#F0A04B;}
}
:root[data-theme="dark"]{color-scheme:dark;
  --bg:#0D0F1C; --surface:#161A2C; --sunk:#1E2338; --ink:#E7E9F5; --muted:#9BA1BC; --line:#2A3050;
  --violet:#A48BF0; --ember:#FB8A4A; --gold:#F2C14E; --ok:#4CC98A; --warn:#F0A04B;}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:15px/1.55 var(--body);margin:0}
a{color:var(--violet);text-underline-offset:2px}
a:hover{color:var(--ember)}
h1,h2,h3{font-family:var(--display);font-stretch:88%;line-height:1.15;text-wrap:balance;margin:0}
button,input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--ember);outline-offset:2px}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.wrap{max-width:1120px;margin:0 auto;padding-inline:20px}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;flex-wrap:wrap;align-items:center;gap:8px 20px;padding-block:12px}
.brand{display:flex;flex-direction:column}
.brand b{font-family:var(--display);font-stretch:80%;font-size:20px;font-weight:800;letter-spacing:.01em}
.brand span{font-size:12px;color:var(--muted)}
.heatbar{height:3px;background:var(--heat)}
nav.tabs{display:flex;gap:4px;flex-wrap:wrap;margin-left:auto}
nav.tabs button{border:0;background:transparent;padding:7px 12px;border-radius:999px;cursor:pointer;color:var(--muted);font-weight:500}
nav.tabs button[aria-selected="true"]{background:var(--ink);color:var(--bg)}
nav.tabs button:hover:not([aria-selected="true"]){background:var(--sunk);color:var(--ink)}
.sync{font-size:12px;color:var(--muted)}

main{padding-block:24px 64px}
section[hidden]{display:none!important}

/* shared */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.eyebrow{font-size:11.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:600}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;padding:2px 9px;border-radius:999px;background:var(--sunk);color:var(--ink);white-space:nowrap}
.chip.ph{color:#fff}
.btn{border:1px solid var(--line);background:var(--surface);padding:7px 12px;border-radius:8px;cursor:pointer}
.btn:hover{border-color:var(--ember)}
.btn.primary{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.prog{height:8px;background:var(--sunk);border-radius:99px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--heat);border-radius:99px}

/* today */
.daynav{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:18px}
.daynav input{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 8px}
.today-grid{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:20px;align-items:start}
@media (max-width:860px){.today-grid{grid-template-columns:1fr}}
.dayhead h1{font-size:clamp(26px,4vw,38px);font-weight:800}
.dayhead .meta{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px}
.weekgoal{margin-top:14px;font-size:16px}
.tasks{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.task{display:grid;grid-template-columns:24px 1fr;gap:10px;align-items:start;padding:12px 14px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.task.done span{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--muted)}
.task input{width:18px;height:18px;margin-top:3px;accent-color:var(--ember);cursor:pointer}
.task small{display:block;color:var(--muted);font-size:12px;margin-top:2px}
.routine{display:flex;flex-direction:column;gap:6px;margin-top:12px;font-size:13.5px;color:var(--muted)}
.routine div::before{content:"↻ ";color:var(--ember)}
.blockttl{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin:26px 0 10px}
.blockttl h2{font-size:19px;font-weight:700}
.reslist{display:flex;flex-direction:column;gap:8px;margin:0;padding:0;list-style:none}
.reslist li{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:baseline}
.kind{font-family:var(--mono);font-size:11px;color:var(--muted);border:1px solid var(--line);border-radius:5px;padding:0 5px;white-space:nowrap}
textarea{width:100%;min-height:110px;border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:12px;resize:vertical}
.rail{display:flex;flex-direction:column;gap:16px}
.stat{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.stat b{font-family:var(--display);font-size:28px;font-weight:800;font-stretch:85%}
.mslist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.mslist li{display:grid;grid-template-columns:52px 1fr;gap:10px}
.mslist .d{font-family:var(--mono);font-size:12px;color:var(--muted);text-align:right}
.leave{padding:28px;text-align:center;background:var(--surface);border:1px dashed var(--line);border-radius:var(--r)}
.leave h2{font-size:24px}
.lecture-nudge{border-left:3px solid var(--violet);padding:10px 14px;background:var(--surface);border-radius:0 var(--r) var(--r) 0;margin-top:14px}

/* plan */
.map{display:grid;grid-template-columns:repeat(auto-fill,minmax(14px,1fr));gap:3px;margin:12px 0 4px}
.map button{aspect-ratio:1;border:0;border-radius:3px;padding:0;cursor:pointer;position:relative;background:var(--sunk);overflow:hidden}
.map button i{position:absolute;inset:auto 0 0 0;display:block}
.map button.lv{background:repeating-linear-gradient(45deg,var(--sunk) 0 3px,transparent 3px 6px)}
.map button.cur{outline:2px solid var(--ink);outline-offset:1px}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12.5px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}
.phase{margin-top:28px}
.phase h2{font-size:22px;font-weight:800;display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.weeks{display:flex;flex-direction:column;gap:6px;margin-top:12px}
details.week{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
details.week>summary{list-style:none;cursor:pointer;display:grid;grid-template-columns:56px 118px 1fr 90px;gap:12px;align-items:center;padding:10px 14px}
details.week>summary::-webkit-details-marker{display:none}
details.week[open]>summary{border-bottom:1px solid var(--line)}
details.week.isleave>summary{color:var(--muted)}
details.week .wbody{padding:14px;display:flex;flex-direction:column;gap:10px}
@media (max-width:640px){details.week>summary{grid-template-columns:44px 1fr 60px}details.week>summary .wd{display:none}}
.dayrow{display:grid;grid-template-columns:88px 1fr;gap:10px;align-items:start}
.dayrow label{display:flex;gap:8px;align-items:flex-start;cursor:pointer}
.dayrow input{margin-top:4px;accent-color:var(--ember)}

/* milestones */
.year{margin-top:26px}
.year h2{font-size:28px;font-weight:800}
.tl{list-style:none;margin:12px 0 0;padding:0;border-left:2px solid var(--line);display:flex;flex-direction:column;gap:12px}
.tl li{position:relative;padding-left:18px;display:grid;grid-template-columns:132px 1fr auto;gap:10px;align-items:baseline}
.tl li::before{content:"";position:absolute;left:-7px;top:6px;width:12px;height:12px;border-radius:50%;background:var(--surface);border:2px solid var(--muted)}
.tl li.k-paper::before{border-color:var(--ember)} .tl li.k-review::before{border-color:var(--violet)} .tl li.k-thesis::before{border-color:var(--gold)} .tl li.k-research::before{border-color:var(--ok)}
.tl li.past::before{background:var(--muted)}
@media (max-width:640px){.tl li{grid-template-columns:1fr}}

/* lectures */
.lgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:16px}
.lec h3{font-size:19px;font-weight:700;margin-top:6px}
.lec ul{margin:8px 0 0;padding-left:18px}
.lec .stamps{margin-top:10px;font-size:13.5px}
.lec .stamps div{display:grid;grid-template-columns:58px 1fr;gap:8px}

/* library */
.libtools{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0 4px}
.libtools input{flex:1 1 240px;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 10px}
.libgroup{margin-top:22px}
.libgroup h2{font-size:19px;font-weight:700}
.libitem{display:grid;grid-template-columns:110px 1fr;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.libitem .used{font-size:12.5px;color:var(--muted)}
@media (max-width:640px){.libitem{grid-template-columns:1fr}}

/* project */
.prose{max-width:68ch}
.prose h2{font-size:24px;font-weight:800;margin-top:30px}
.prose h3{font-size:18px;font-weight:700;margin-top:20px}
.rq{display:grid;gap:12px;margin-top:12px}
.rq .card h3{margin-top:4px}
.table-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
@media (prefers-reduced-motion:no-preference){.prog i{transition:width .4s ease}}
</style>

      <button role="tab" data-tab="project" aria-selected="false">Project</button>
    </nav>
    <span class="sync" id="sync">Saving on this device</span>
  </div>
</div>

<main class="wrap">

</main>

const W = [];
function wk(t, g, d, r, del) { W.push({t, g, d, r: r || [], del: del || ""}); }
function leave(t) { W.push({t, g: t, d: [], r: [], leave: true}); }

// Helpers for writing weeks, so paper and chapter weeks stay consistent
function paper(n, part, topic, r) {
  const P = {
    outline: ["Pick the target journal; read its author guide and 2 recent papers there as models",
              "Write the paper's one-sentence claim and a 6-figure storyboard",
              "Draft the introduction: gap, question, contribution (about 800 words)",
              "Draft the related-work paragraphs from your literature matrix",
              "Send the storyboard and introduction to supervisors for a quick yes/no"],
    methods: ["Draft the methods: model, data, uncertainty sources",
              "Write the equations once, in the notation of your nomenclature list",
              "Describe the numerical set-up so someone else could repeat it",
              "Make the method schematic figure",
              "Check every method choice has a reason and a citation"],
    results: ["Produce final versions of results figures 1 to 3 from scripts in the repo",
              "Produce final versions of results figures 4 to 6",
              "Write the results text: one paragraph per figure, numbers with uncertainty",
              "Make the summary table of metrics",
              "Re-run the full pipeline from a clean checkout to confirm reproducibility"],
    discuss: ["Draft the discussion: what the results mean for digital-twin validation",
              "Write limitations honestly (data, assumptions, cost)",
              "Write the conclusion and the abstract (250 words)",
              "Full read-through; cut 10 percent of the words",
              "Send the full draft to supervisors and Lloyd Fletcher"],
    revise: ["Go through supervisor comments; make a response table",
             "Fix the major comments",
             "Fix the minor comments and the figures",
             "Prepare the cover letter, highlights and data/code availability statement",
             "Final proofread and format to the journal template"],
    submit: ["Final check of author list, affiliations (Swansea, UKAEA) and funding statement (FOSTER/UKAEA)",
             "Tag the code release on GitHub and archive it on Zenodo for a DOI",
             "Submit the paper; save the submission PDF to your thesis folder",
             "Post the preprint on arXiv if supervisors agree",
             "Update your CV and Swansea profile; note reviewer suggestions for later"]
  };
  wk("Paper " + n + ": " + {outline:"outline and introduction", methods:"methods", results:"results", discuss:"discussion and abstract", revise:"revision", submit:"submission"}[part],
     "Paper " + n + " (" + topic + "): " + {outline:"set the story", methods:"write the methods", results:"lock the results", discuss:"finish the full draft", revise:"respond to internal review", submit:"submit and release code"}[part] + ".",
     P[part], r || [], part === "submit" ? "Paper " + n + " submitted" : "Paper " + n + " " + part + " section done");
}
function chapter(code, name, part, r) {
  const C = {
    a: ["Re-read the source material for " + name + " (papers, notes, figures); list what the chapter must show",
        "Write a detailed section outline with a figure list; agree it in supervision",
        "Draft section 1 (about 1,500 words)",
        "Draft section 2 (about 1,500 words)",
        "Make or update 2 figures; push everything to the thesis repo"],
    b: ["Draft section 3 (about 1,500 words)",
        "Draft section 4 (about 1,500 words)",
        "Fill citations; check that every claim has a source",
        "Rewrite the weakest section",
        "Update figures, captions and cross-references"],
    c: ["Write the chapter summary and the link to the next chapter",
        "Read the whole chapter on paper; mark gaps",
        "Fix the gaps; tighten the language (plain English, short paragraphs)",
        "Check notation against the nomenclature list",
        "Send the chapter to supervisors with 3 specific questions"]
  };
  wk(code + " " + name + " (" + {a:"start", b:"middle", c:"finish"}[part] + ")",
     "Thesis " + code + ": " + {a:"outline and first sections", b:"main body", c:"complete and send"}[part] + ".",
     C[part], r || ["overleaf","zotero"], code + " " + {a:"sections 1-2 drafted", b:"sections 3-4 drafted", c:"sent to supervisors"}[part]);
}

<h2>The project in plain words</h2>
<p>A fusion power plant has parts, such as the divertor, that take heat loads of 10 to 20 MW/m². Engineers want "digital twins" of these parts: computer models that stay in step with the real part and can be trusted to predict its temperature, stress and lifetime. There are three ways to build the model inside a twin:</p>
<ul>
<li><b>Physics-based models</b> (finite elements in MOOSE): reliable when the inputs are right, but slow, and the inputs (material data, boundary conditions) are uncertain.</li>

<li><b>AI models</b>: fast, but most are trained on synthetic simulation data, and nobody has properly tested how well they hold up on real measurements.</li>

<p>Your job is to measure, with honest uncertainty, what each approach can and cannot do, and to show when physics is essential, when data is enough, and how to combine them.</p>

function easter(y){const a=y%19,b=Math.floor(y/100),c=y%100,d=Math.floor(b/4),e=b%4,f=Math.floor((b+8)/25),g=Math.floor((b-f+1)/3),h=(19*a+b-d-g+15)%30,i=Math.floor(c/4),k=c%4,l=(32+2*e+2*i-h-k)%7,m=Math.floor((a+11*h+22*l)/451),mo=Math.floor((h+l-7*m+114)/31),da=((h+l-7*m+114)%31)+1;return new Date(y,mo-1,da)}

function lastMon(y,m){let d=new Date(y,m+1,0);while(d.getDay()!==1)d=addDays(d,-1);return d}

for(let y=2026;y<=2031;y++){
  let nyd=new Date(y,0,1); if(nyd.getDay()===6)nyd=addDays(nyd,2); else if(nyd.getDay()===0)nyd=addDays(nyd,1); HOL[ymd(nyd)]="New Year's Day";
  const e=easter(y); HOL[ymd(addDays(e,-2))]="Good Friday"; HOL[ymd(addDays(e,1))]="Easter Monday";
  HOL[ymd(firstMon(y,4))]="Early May bank holiday"; HOL[ymd(lastMon(y,4))]="Spring bank holiday"; HOL[ymd(lastMon(y,7))]="Summer bank holiday";
  const x=new Date(y,11,25), dw=x.getDay();
  if(dw===6){HOL[ymd(addDays(x,2))]="Christmas Day (substitute)";HOL[ymd(addDays(x,3))]="Boxing Day (substitute)"}
  else if(dw===5){HOL[ymd(x)]="Christmas Day";HOL[ymd(addDays(x,3))]="Boxing Day (substitute)"}
  else if(dw===0){HOL[ymd(addDays(x,1))]="Boxing Day";HOL[ymd(addDays(x,2))]="Christmas Day (substitute)"}
  else {HOL[ymd(x)]="Christmas Day";HOL[ymd(addDays(x,1))]="Boxing Day"}
}

  const byDay={}; // weekday index -> [task indexes]
  if(!w.leave){ w.d.forEach((t,ti)=>{const slot=work[Math.min(ti,work.length-1)]; (byDay[slot]=byDay[slot]||[]).push(ti)}) }
  for(let k=0;k<7;k++){const d=addDays(ws,k); out.push({date:d,k,tasks:byDay[k]||[],hol:HOL[ymd(d)]||null})}
  return out;
}

      if(n.exists){Object.assign(state.notes,(n.data().notes)||{})}

}

    const ys=[...dirtyNotesYears]; dirtyNotesYears.clear();
    try{

}

/* ---- progress ---- */
function weekProgress(i){const w=W[i]; if(w.leave||!w.d.length) return null; let n=0; w.d.forEach((_,t)=>{if(state.done[taskKey(i,t)])n++}); return n/w.d.length}

/* ---- tabs ---- */
let current="today", viewDate=null;
function show(tab){current=tab; document.querySelectorAll("nav.tabs button").forEach(b=>b.setAttribute("aria-selected",String(b.dataset.tab===tab))); document.querySelectorAll("main>section").forEach(s=>s.hidden=s.id!=="tab-"+tab); render(tab); window.scrollTo({top:0})}
document.querySelectorAll("nav.tabs button").forEach(b=>b.addEventListener("click",()=>show(b.dataset.tab)));

function realToday(){const n=new Date(); return new Date(n.getFullYear(),n.getMonth(),n.getDate())}
function clampDate(d){ if(d>PLAN_END) return PLAN_END; return d; }

function resItem(id){const r=LIB[id]; if(!r) return ""; return `<li><span class="kind">${esc(r.k)}</span><a href="${esc(r.u)}" target="_blank" rel="noopener">${esc(r.t)}</a></li>`}
function lectureRefs(text){const m=String(text).match(/Lecture (L\d)/g); return m?m.map(s=>s.split(" ")[1]):[]}

/* ---- TODAY ---- */
function renderToday(){
  const el=$("#tab-today"); const d=viewDate;
  const nav=`<div class="daynav">
    <button class="btn" id="prevDay" aria-label="Previous day">← Day</button>
    <button class="btn" id="nextDay" aria-label="Next day">Day →</button>
    <button class="btn" id="prevWeek">← Week</button>
    <button class="btn" id="nextWeek">Week →</button>
    <button class="btn primary" id="goToday">Today</button>
    <label class="muted" for="pick" style="margin-left:auto">Jump to</label>
    <input type="date" id="pick" min="2026-10-01" max="2030-12-31" value="${ymd(d)}">
  </div>`;
  if(d<START){ el.innerHTML=nav+renderPrestart(d); wireDayNav();
    el.querySelectorAll("input[data-key]").forEach(cb=>cb.addEventListener("change",e=>{toggle(e.target.dataset.key,e.target.checked); e.target.closest(".task").classList.toggle("done",e.target.checked)}));
    return; }
  const i=Math.max(0,Math.min(NWEEKS-1,Math.floor(daysBetween(START,d)/7)));
  const w=W[i], pi=phaseOf(i), ph=PHASES[pi], days=weekDays(i);
  const dow=(d.getDay()+6)%7; // 0=Mon
  const thisDay = d<START ? null : days[dow];
  const hol=HOL[ymd(d)];
  const month=Math.floor(daysBetween(MAIN_START,d)/30.44)+1;
  let main="";
  const head=`<div class="dayhead"><div class="eyebrow">${i<MAIN0?"Head start week "+(i+1)+" of "+MAIN0+" · self-study, about 3 hours a day":"Week "+(i-MAIN0+1)+" of "+(NWEEKS-MAIN0)+" · PhD month "+Math.max(1,month)}</div>
    <h1>${esc(fmt(d))}</h1>
    <div class="meta"><span class="chip ph" style="background:${PH_COLORS[pi]}">Phase ${ph.id} · ${esc(ph.n)}</span>${hol?`<span class="chip">${esc(hol)}</span>`:""}</div>
    <p class="weekgoal"><b>${esc(w.t)}.</b> ${esc(w.g)}</p></div>`;
  if(w.leave){
    main=`<div class="leave"><h2>${esc(w.t)}</h2><p class="muted">Planned leave. Swansea gives up to 31 days a year plus bank holidays; this plan uses about 20. Rest properly, so the next block goes well.</p></div>`;
  } else if(dow===5){
    main=`<div class="leave"><h2>Saturday</h2><p class="muted">Optional, 1 hour at most: read your notes from this week, tick anything you finished, and look at next week's goal. Then stop.</p></div>`;
  } else if(dow===6){
    main=`<div class="leave"><h2>Sunday: rest</h2><p class="muted">No PhD work today. A rested mind does better research on Monday.</p></div>`;
  } else if(hol){
    main=`<div class="leave"><h2>${esc(hol)}</h2><p class="muted">Bank holiday. This week's tasks have been spread over the other working days.</p></div>`;
  } else {
    const items=thisDay.tasks.map(ti=>taskLi(i,ti)).join("");
    const routine=[];
    if(dow===0) routine.push("Plan the week (15 min): read the goal, block time in your calendar.");
    if(dow===2) routine.push("Supervision slot (default Wednesday; use the day you agreed).");
    if(dow===4) routine.push("Weekly log (20 min): done, blocked, next. Push to GitHub and back up.");
    if(i<MAIN0) routine.push("Commit today's code and notes to your phd-headstart repo.");
    if(i>=MAIN0+2&&i<MAIN0+185) routine.push("20 min: read one abstract from your Zotero queue and tag it.");
    main=`<div class="blockttl"><h2>Today</h2><span class="muted mono" id="dayCount"></span></div><ul class="tasks">${items||'<li class="muted">No task assigned; use today to catch up on anything unticked this week.</li>'}</ul><div class="routine">${routine.map(r=>`<div>${esc(r)}</div>`).join("")}</div>`;
    const lecs=[...new Set(thisDay.tasks.flatMap(ti=>lectureRefs(w.d[ti])))];
    if(lecs.length) main+=lecs.map(l=>{const L=LECTURES.find(x=>x.id===l); return L?`<div class="lecture-nudge"><b>${esc(L.id)}: ${esc(L.title)}</b> · <span class="muted">${esc(L.who)}, ${esc(L.len)}</span><br>Local file: <span class="mono">${esc(L.file)}</span> · <a href="#" data-golec="${esc(L.id)}">Open the study guide</a></div>`:""}).join("");
  }
  // rest of week
  let weekList="";
  if(!w.leave){
    weekList=`<div class="blockttl"><h2>This week</h2><span class="muted mono" id="weekCount"></span></div><ul class="tasks">`+
      days.filter(x=>x.tasks.length).map(x=>x.tasks.map(ti=>taskLi(i,ti,short(x.date)+" · "+x.date.toLocaleDateString("en-GB",{weekday:"short"}))).join("")).join("")+`</ul>`;
    if(w.del) weekList+=`<p style="margin-top:12px"><span class="eyebrow">Deliverable by Friday</span><br>${esc(w.del)}</p>`;
  }
  const res = w.r.length?`<div class="blockttl"><h2>Materials for this week</h2></div><ul class="reslist">${w.r.map(resItem).join("")}</ul>`:"";
  const notes=`<div class="blockttl"><h2>Notes for ${esc(short(d))}</h2><span class="muted" style="font-size:12.5px">Saved automatically</span></div><textarea id="note" aria-label="Notes for this day" placeholder="What did you learn? What is blocking you? What will you ask in supervision?">${esc(state.notes[ymd(d)]||"")}</textarea>`;
  el.innerHTML=nav+`<div class="today-grid"><div>${head}${main}${weekList}${res}${notes}</div><aside class="rail">${railHtml(d,i)}</aside></div>`;
  wireDayNav();
  el.querySelectorAll("input[data-key]").forEach(cb=>cb.addEventListener("change",e=>{toggle(e.target.dataset.key,e.target.checked); e.target.closest(".task").classList.toggle("done",e.target.checked); syncTwins(e.target)}));
  const ta=$("#note"); ta.addEventListener("input",()=>{const k=ymd(d); if(ta.value) state.notes[k]=ta.value; else delete state.notes[k]; persistNotes(d.getFullYear())});
  el.querySelectorAll("[data-golec]").forEach(a=>a.addEventListener("click",e=>{e.preventDefault(); show("lectures"); const t=document.getElementById("lec-"+a.dataset.golec); if(t) t.scrollIntoView({behavior:"smooth"})}));
  refreshCounts();
}
function taskLi(i,ti,label){const k=taskKey(i,ti), on=!!state.done[k]; const id="cb-"+k+(label?"-w":"");
  return `<li class="task${on?" done":""}"><input type="checkbox" id="${id}" data-key="${k}" ${on?"checked":""}><label for="${id}"><span>${esc(W[i].d[ti])}</span>${label?`<small>${esc(label)}</small>`:""}</label></li>`}
function syncTwins(src){document.querySelectorAll(`input[data-key="${src.dataset.key}"]`).forEach(o=>{if(o!==src){o.checked=src.checked; const li=o.closest(".task"); if(li) li.classList.toggle("done",src.checked)}})}
function railHtml(d,i){
  const tp=totalProgress(), pct=tp.t?Math.round(100*tp.n/tp.t):0;
  const wp=weekProgress(i);
  const today=realToday();
  const up=MILESTONES.map(m=>({...m,date:addDays(weekStart(m.w),m.d)})).filter(m=>m.date>=d).slice(0,4);
  const daysLeft=daysBetween(today,PLAN_END);
  return `<div class="card"><div class="eyebrow">Whole PhD</div><div class="stat"><b class="mono" id="totPct">${pct}%</b><span class="muted mono" id="totN">${tp.n} / ${tp.t} tasks</span></div><div class="prog"><i id="totBar" style="width:${pct}%"></i></div>
   ${wp!==null?`<div class="eyebrow" style="margin-top:14px">This week</div><div class="prog"><i id="wkBar" style="width:${Math.round(wp*100)}%"></i></div>`:""}
   <p class="muted" style="font-size:13px;margin:12px 0 0">${daysLeft>0?daysLeft.toLocaleString("en-GB")+" days until the funded period ends (31 Dec 2030).":"Funded period finished."}</p></div>
   <div class="card"><div class="eyebrow">Next milestones</div><ul class="mslist" style="margin-top:10px">${up.map(m=>`<li><span class="d">${esc(short(m.date))}<br>${m.date.getFullYear()}</span><span>${esc(m.t)}<br><span class="muted" style="font-size:12.5px">in ${daysBetween(d,m.date)} days</span></span></li>`).join("")||'<li class="muted">All milestones passed.</li>'}</ul>
   <button class="btn" style="margin-top:12px" id="toMs">All milestones</button></div>
   ${i<MAIN0?preCard():""}<div class="card"><div class="eyebrow">Phase</div><p style="margin:6px 0 0">${esc(PHASES[phaseOf(i)].n)}: ${esc(wShort(PHASES[phaseOf(i)].s))} to ${esc(wShort(PHASES[phaseOf(i)].e))}, ${esc(short(weekStart(PHASES[phaseOf(i)].s)))} ${weekStart(PHASES[phaseOf(i)].s).getFullYear()} to ${esc(short(addDays(weekStart(PHASES[phaseOf(i)].e),4)))} ${addDays(weekStart(PHASES[phaseOf(i)].e),4).getFullYear()}.</p></div>`;
}
function refreshCounts(){
  const tp=totalProgress(), pct=tp.t?Math.round(100*tp.n/tp.t):0;
  const a=$("#totPct"),b=$("#totN"),c=$("#totBar"); if(a){a.textContent=pct+"%";b.textContent=tp.n+" / "+tp.t+" tasks";c.style.width=pct+"%"}
  if(viewDate&&viewDate>=START){const i=Math.min(NWEEKS-1,Math.floor(daysBetween(START,viewDate)/7)); const wp=weekProgress(i); const wb=$("#wkBar"); if(wb&&wp!==null) wb.style.width=Math.round(wp*100)+"%";
    const wc=$("#weekCount"); if(wc&&!W[i].leave){let n=0;W[i].d.forEach((_,t)=>{if(state.done[taskKey(i,t)])n++}); wc.textContent=n+" of "+W[i].d.length+" done"}}
}
function wireDayNav(){
  const go=n=>{viewDate=clampDate(addDays(viewDate,n)); renderToday()};
  $("#prevDay").onclick=()=>go(-1); $("#nextDay").onclick=()=>go(1); $("#prevWeek").onclick=()=>go(-7); $("#nextWeek").onclick=()=>go(7);
  $("#goToday").onclick=()=>{viewDate=clampDate(realToday()); renderToday()};
  $("#pick").onchange=e=>{if(e.target.value){viewDate=clampDate(parse(e.target.value)); renderToday()}};
  const ms=$("#toMs"); if(ms) ms.onclick=()=>show("milestones");
}
const PRE_ITEMS=[
    ["Get the January 2027 start confirmed in writing (start date + FOSTER/UKAEA scholarship moved)","Email sent 6 Oct 2026 to Prof. Nithiarasu and Zoë Perry"],
    ["Complete the Qualification Check so the offer becomes unconditional","Admissions emailed the consent request on 22 Sep 2026"],
    ["ATAS certificate","Applied 28 Sep 2026; 30+ working days"],
    ["CAS from Swansea (needs ATAS + unconditional offer + new start date)","Started 29 Sep 2026"],
    ["Student visa application (priority service if time is short)","After CAS"],
    ["Accept the scholarship in the Learner Gateway","As well as the signed letter you emailed"],
    ["Book accommodation and a flight arriving by 31 Dec 2026",""]
  ];
function preCard(){return `<div class="card"><div class="eyebrow">Admin before you travel</div><ul class="tasks" style="margin-top:10px">${PRE_ITEMS.map((x,j)=>{const k="pre"+j,on=!!state.done[k];return `<li class="task${on?" done":""}" style="padding:8px 10px"><input type="checkbox" id="cb-${k}" data-key="${k}" ${on?"checked":""}><label for="cb-${k}"><span style="font-size:13.5px">${esc(x[0])}</span>${x[1]?`<small>${esc(x[1])}</small>`:""}</label></li>`}).join("")}</ul></div>`}
function renderPrestart(d){
  const n=daysBetween(d,START);
  return `<div class="dayhead"><div class="eyebrow">Before the head start</div><h1>${esc(fmt(d))}</h1><p class="weekgoal"><b>${n} day${n===1?"":"s"}</b> until Monday 12 October 2026, when your 12-week head start begins. The PhD itself starts Monday 4 January 2027 (if the deferral is approved).</p></div>
  <div class="today-grid" style="margin-top:16px"><div><div class="blockttl"><h2>Get ready this week</h2></div><ul class="tasks">
  ${[["Install Git, VS Code and uv; create a GitHub account if you don't have one","pc0"],["Clear 3 hours a day on your calendar, Monday to Friday, for the next 11 weeks","pc1"],["Look through the Plan tab to see where the head start leads","pc2"]].map(([t,k])=>{const on=!!state.done[k];return `<li class="task${on?" done":""}"><input type="checkbox" id="cb-${k}" data-key="${k}" ${on?"checked":""}><label for="cb-${k}"><span>${esc(t)}</span></label></li>`}).join("")}
  </ul><p class="muted" style="margin-top:16px">Use "Week →" or "Jump to" to look ahead.</p></div><aside class="rail">${preCard()}</aside></div>`;
}

/* ---- PLAN ---- */
function renderPlan(){
  const el=$("#tab-plan"); const ti=realToday(); const cur=ti>=START?Math.floor(daysBetween(START,ti)/7):-1;
  let map=`<div class="card"><div class="eyebrow">Head start + 209 PhD weeks at a glance</div><div class="map" role="list">`+
    W.map((w,i)=>{const p=weekProgress(i), c=PH_COLORS[phaseOf(i)]; return `<button role="listitem" class="${w.leave?"lv":""} ${i===cur?"cur":""}" data-week="${i}" title="${esc(wLabel(i))} · ${esc(short(weekStart(i)))} ${weekStart(i).getFullYear()} · ${esc(w.t)}" style="${w.leave?"":"background:color-mix(in srgb, "+c+" 22%, var(--sunk))"}"><i style="height:${w.leave?0:Math.round((p||0)*100)}%;background:${c}"></i></button>`}).join("")+
    `</div><div class="legend">${PHASES.map((p,j)=>`<span><i style="background:${PH_COLORS[j]}"></i>${esc(p.id)} ${esc(p.n)}</span>`).join("")}<span><i style="background:repeating-linear-gradient(45deg,var(--muted) 0 2px,transparent 2px 4px)"></i>Leave</span></div><p class="muted" style="font-size:12.5px;margin:8px 0 0">Each square is one week; it fills as you tick tasks. Click a square to open that week in Today.</p></div>`;
  const ph=PHASES.map((p,j)=>{
    const rows=[]; for(let i=p.s;i<=p.e;i++){const w=W[i], pr=weekProgress(i);
      const days=weekDays(i);
      const body=w.leave?`<p class="muted">Leave week.</p>`:days.filter(x=>x.tasks.length).map(x=>x.tasks.map(t=>{const k=taskKey(i,t),on=!!state.done[k];return `<div class="dayrow"><span class="mono muted" style="font-size:12.5px">${esc(x.date.toLocaleDateString("en-GB",{weekday:"short",day:"numeric",month:"short"}))}</span><label><input type="checkbox" data-key="${k}" ${on?"checked":""}><span>${esc(w.d[t])}</span></label></div>`}).join("")).join("")+
        (w.del?`<p style="margin:6px 0 0"><span class="eyebrow">Deliverable</span> ${esc(w.del)}</p>`:"")+
        (w.r.length?`<ul class="reslist" style="margin-top:6px">${w.r.map(resItem).join("")}</ul>`:"")+
        `<div><button class="btn" data-open="${i}">Open in Today</button></div>`;
      rows.push(`<details class="week${w.leave?" isleave":""}"${i===cur?" open":""}><summary><span class="mono muted">${esc(wShort(i))}</span><span class="mono muted wd">${esc(weekStart(i).toLocaleDateString("en-GB",{day:"numeric",month:"short",year:"numeric"}))}</span><span>${esc(w.t)}</span><span>${pr===null?'<span class="muted" style="font-size:12px">leave</span>':`<span class="prog"><i style="width:${Math.round(pr*100)}%"></i></span>`}</span></summary><div class="wbody">${body}</div></details>`)}
    return `<div class="phase"><h2><span class="chip ph" style="background:${PH_COLORS[j]}">Phase ${p.id}</span>${esc(p.n)} <span class="muted mono" style="font-size:13px;font-family:var(--mono)">${esc(short(weekStart(p.s)))} ${weekStart(p.s).getFullYear()} to ${esc(short(addDays(weekStart(p.e),4)))} ${addDays(weekStart(p.e),4).getFullYear()}</span></h2><div class="weeks">${rows.join("")}</div></div>`}).join("");
  el.innerHTML=`<h1 style="font-size:34px;font-weight:800">The whole plan</h1><p class="muted prose">A 12-week head start (self-study from 12 October 2026), then seven phases over 209 weeks, five tasks per working week. Bank holidays and leave are built in. Tick tasks here or in Today; both stay in sync.</p>`+map+ph;
  el.querySelectorAll(".map button").forEach(b=>b.addEventListener("click",()=>{viewDate=weekStart(+b.dataset.week); show("today")}));
  el.querySelectorAll("[data-open]").forEach(b=>b.addEventListener("click",()=>{viewDate=weekStart(+b.dataset.open); show("today")}));
  el.querySelectorAll("input[data-key]").forEach(cb=>cb.addEventListener("change",e=>{toggle(e.target.dataset.key,e.target.checked); const det=e.target.closest("details"); const i=+e.target.dataset.key.match(/w(\d+)/)[1]; const bar=det.querySelector("summary .prog i"); if(bar) bar.style.width=Math.round(weekProgress(i)*100)+"%"}));
  const c=el.querySelector("details[open]"); if(c) setTimeout(()=>c.scrollIntoView({block:"center"}),50);
}

/* ---- MILESTONES ---- */
function renderMilestones(){
  const el=$("#tab-milestones"), t=realToday();
  const ms=MILESTONES.map((m,j)=>({...m,j,date:addDays(weekStart(m.w),m.d)}));
  const years=[2027,2028,2029,2030];
  const kinds={admin:"Admin",review:"Review",research:"Research",paper:"Paper",thesis:"Thesis"};
  el.innerHTML=`<h1 style="font-size:34px;font-weight:800">Milestones</h1><p class="muted prose">Reviews follow Swansea's candidature guide: confirmation within three months, then regular progress reviews (check exact dates in e:Vision). Papers, conference and thesis dates are targets you can move.</p>
   <div class="legend" style="margin-top:10px"><span><i style="background:var(--violet)"></i>Review</span><span><i style="background:var(--ember)"></i>Paper</span><span><i style="background:var(--ok)"></i>Research</span><span><i style="background:var(--gold)"></i>Thesis</span><span><i style="background:var(--muted)"></i>Admin</span></div>`+
   years.map(y=>`<div class="year"><h2>${y}</h2><ol class="tl">${ms.filter(m=>m.date.getFullYear()===y||(y===2027&&m.date.getFullYear()<2027)).map(m=>{const k="ms"+m.j,on=!!state.done[k]; const dd=daysBetween(t,m.date);
     return `<li class="k-${m.k}${m.date<t?" past":""}"><span class="mono muted">${esc(m.date.toLocaleDateString("en-GB",{weekday:"short",day:"numeric",month:"short"}))}</span><span><b>${esc(m.t)}</b><br><span class="muted" style="font-size:12.5px">${esc(kinds[m.k])} · ${esc(wLabel(m.w))}${dd>0?" · in "+dd+" days":""}</span></span><label class="muted" style="font-size:13px;display:flex;gap:6px;align-items:center"><input type="checkbox" data-key="${k}" ${on?"checked":""} style="accent-color:var(--ember)">Done</label></li>`}).join("")}</ol></div>`).join("");
  el.querySelectorAll("input[data-key]").forEach(cb=>cb.addEventListener("change",e=>toggle(e.target.dataset.key,e.target.checked)));
}

/* ---- LECTURES ---- */
function renderLectures(){
  const el=$("#tab-lectures");
  const when=id=>{const out=[]; W.forEach((w,i)=>w.d.forEach(t=>{if(lectureRefs(t).includes(id)) out.push(i)})); return out};
  el.innerHTML=`<h1 style="font-size:34px;font-weight:800">Your seven lectures</h1><p class="muted prose">From your folder Downloads/phd. Each has a study guide: why it matters for your project, the key ideas to take from it, and the week it is scheduled in the plan. Watch with a notebook open and write the ideas in your own words.</p>
   <div class="lgrid" style="margin-top:16px">`+LECTURES.map(L=>{const ws=when(L.id);
     return `<article class="card lec" id="lec-${esc(L.id)}"><div class="eyebrow">${esc(L.id)} · ${esc(L.len)}${ws.length?" · scheduled: "+ws.map(wShort).join(", "):""}</div><h3>${esc(L.title)}</h3><p class="muted" style="margin:4px 0 0">${esc(L.who)}</p>
     <p style="margin:10px 0 0"><b>Why it matters for you.</b> ${esc(L.why)}</p>
     <ul>${L.ideas.map(x=>`<li>${esc(x)}</li>`).join("")}</ul>
     ${L.stamps&&L.stamps.length?`<div class="stamps"><div class="eyebrow" style="margin-bottom:4px">Where to look</div>${L.stamps.map(s=>`<div><span class="mono muted">${esc(s[0])}</span><span>${esc(s[1])}</span></div>`).join("")}</div>`:""}
     <p class="muted" style="font-size:12.5px;margin:10px 0 0">File: <span class="mono">${esc(L.file)}</span>${L.read&&L.read.length?" · Read with: "+L.read.map(r=>LIB[r]?`<a href="${esc(LIB[r].u)}" target="_blank" rel="noopener">${esc(LIB[r].t.split(":")[0])}</a>`:"").join(", "):""}</p>
     ${ws.length?`<button class="btn" style="margin-top:10px" data-open="${ws[0]}">Go to ${esc(wLabel(ws[0]))}</button>`:""}</article>`}).join("")+`</div>`;
  el.querySelectorAll("[data-open]").forEach(b=>b.addEventListener("click",()=>{const i=+b.dataset.open; const days=weekDays(i); const hit=days.find(x=>x.tasks.some(t=>lectureRefs(W[i].d[t]).length)); viewDate=hit?hit.date:weekStart(i); show("today")}));
}

/* ---- LIBRARY ---- */
let libQuery="", libGroup="All";
function renderLibrary(){
  const el=$("#tab-library");
  const used={}; W.forEach((w,i)=>w.r.forEach(r=>{(used[r]=used[r]||[]).push(wShort(i))}));
  const groups=[...new Set(Object.values(LIB).map(r=>r.g))];
  const q=libQuery.toLowerCase();
  const list=Object.entries(LIB).filter(([id,r])=>(libGroup==="All"||r.g===libGroup)&&(!q||(r.t+" "+r.k+" "+r.g).toLowerCase().includes(q)));
  el.innerHTML=`<h1 style="font-size:34px;font-weight:800">Library</h1><p class="muted prose">${Object.keys(LIB).length} books, papers, courses, tools and Swansea pages, all linked from the weeks where you need them. Links were checked in October 2026; publisher pages may ask you to sign in through Swansea's library.</p>
  <div class="libtools"><input id="libq" type="search" placeholder="Search titles, e.g. Gaussian, MOOSE, calibration" value="${esc(libQuery)}" aria-label="Search the library"><select id="libg" class="btn" aria-label="Filter by topic"><option>All</option>${groups.map(g=>`<option${g===libGroup?" selected":""}>${esc(g)}</option>`).join("")}</select></div>`+
  groups.filter(g=>list.some(([,r])=>r.g===g)).map(g=>`<div class="libgroup"><h2>${esc(g)}</h2>${list.filter(([,r])=>r.g===g).map(([id,r])=>`<div class="libitem"><span><span class="kind">${esc(r.k)}</span></span><span><a href="${esc(r.u)}" target="_blank" rel="noopener">${esc(r.t)}</a><br><span class="used">${used[id]?"Used in "+used[id].slice(0,12).join(", ")+(used[id].length>12?"…":""):"Background reference"}</span></span></div>`).join("")}</div>`).join("")+(list.length?"":`<p class="muted" style="margin-top:20px">Nothing matches "${esc(libQuery)}". Try a shorter word.</p>`);
  const qi=$("#libq"); qi.addEventListener("input",()=>{libQuery=qi.value; const pos=qi.selectionStart; renderLibrary(); const n=$("#libq"); n.focus(); n.setSelectionRange(pos,pos)});
  $("#libg").addEventListener("change",e=>{libGroup=e.target.value; renderLibrary()});
}

/* ---- CONFERENCES ---- */
function renderConferences(){
  const el=$("#tab-conferences"); const by={}; CONF.forEach(c=>by[c.id]=c);
  const fields=[...new Set(CONF.map(c=>c.f))];
  const pill=s=>`<span class="chip" style="${s==="confirmed"?"background:color-mix(in srgb,var(--ok) 18%,var(--surface));":""}">${s==="confirmed"?"Confirmed":"Expected"}</span>`;
  const pr=p=>`<span class="chip" style="${p==="Core"?"background:var(--ink);color:var(--bg)":p==="Strong"?"background:color-mix(in srgb,var(--ember) 20%,var(--surface))":""}">${esc(p)}</span>`;
  el.innerHTML=`<h1 style="font-size:34px;font-weight:800">Conferences</h1>
  <p class="muted prose">${CONF.length} meetings across fusion engineering, computational mechanics, uncertainty and V&V, scientific ML, heat transfer and experimental mechanics. "Confirmed" means the dates and place are announced; "Expected" follows the series' usual cycle, so check the website about a year ahead. Ask your supervisors early what travel budget your FOSTER/UKAEA studentship has, and apply for travel grants (for example from the conference itself or learned societies) when you submit an abstract.</p>
  <div class="card" style="margin-top:16px"><div class="eyebrow">Recommended path</div>
  ${CONF_PLAN.map(Y=>`<div style="margin-top:14px"><h2 style="font-size:22px;font-weight:800">${Y.y}</h2><ol class="tl">${Y.items.map(([m,id,t])=>`<li class="k-${by[id].p==="Core"?"paper":by[id].p==="Strong"?"review":"admin"}"><span class="mono muted">${esc(m)}</span><span><b>${esc(by[id].n.split(":")[0])}</b><br><span class="muted" style="font-size:13.5px">${esc(t)}</span></span><span></span></li>`).join("")}</ol></div>`).join("")}
  </div>`+
  fields.map(f=>`<div class="libgroup"><h2>${esc(f)}</h2><div class="lgrid" style="margin-top:12px">${CONF.filter(c=>c.f===f).map(c=>`<article class="card lec"><div style="display:flex;gap:6px;flex-wrap:wrap">${pr(c.p)}<span class="chip">${esc(c.cyc)}</span></div><h3><a href="${esc(c.u)}" target="_blank" rel="noopener">${esc(c.n)}</a></h3><p style="margin:8px 0 0">${esc(c.why)}</p>
    <div class="stamps" style="margin-top:12px"><div class="eyebrow" style="margin-bottom:6px">Editions</div>${c.ed.map(e=>`<div style="grid-template-columns:52px 1fr;margin-bottom:6px"><span class="mono muted">${e.y}</span><span>${esc(e.w)} · ${esc(e.at)} ${pill(e.s)}${e.note?`<br><span class="muted" style="font-size:12.5px">${esc(e.note)}</span>`:""}</span></div>`).join("")}</div></article>`).join("")}</div></div>`).join("")+
  `<p class="muted" style="font-size:12.5px;margin-top:24px">Researched October 2026. Conference dates change; always confirm on the official site before submitting or booking.</p>`;
}

/* ---- PROJECT ---- */
function renderProject(){ $("#tab-project").innerHTML=PROJECT_HTML; }

function render(tab){({today:renderToday,plan:renderPlan,milestones:renderMilestones,conferences:renderConferences,lectures:renderLectures,library:renderLibrary,project:renderProject})[tab]()}
function renderAll(){render(current)}

viewDate=clampDate(realToday());
show("today");
initStore();
})();
</script>
